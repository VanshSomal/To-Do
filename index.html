<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-indigo-500 to-purple-600 min-h-screen flex items-center justify-center">

    <div class="bg-white shadow-2xl rounded-2xl p-6 w-full max-w-md">

        <h1 class="text-2xl font-bold text-center mb-4 text-gray-800">
            ✨ Todo List
        </h1>

        <!-- Input Section -->
        <div class="flex gap-2 mb-4">
            <input 
                type="text" 
                id="todo-input" 
                placeholder="Enter a task..."
                class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
            >
            <button 
                id="add-btn"
                class="bg-indigo-500 text-white px-4 py-2 rounded-lg hover:bg-indigo-600 transition"
            >
                Add
            </button>
        </div>

        <!-- Todo List -->
        <ul id="todo-list" class="space-y-2"></ul>

    </div>

    <script src="script.js"></script>
</body>
</html>
